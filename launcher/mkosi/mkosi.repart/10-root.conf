# Root partition — the story-kernel rootfs, protected by dm-verity.
#
# Verity=data + a paired Verity=hash partition (20-root-verity.conf) make
# systemd-repart build a dm-verity tree over this partition and compute the
# roothash. mkosi injects that roothash into the UKI kernel command line, and
# systemd's veritysetup generator mounts the root read-only via dm-verity at
# boot using the discoverable GPT partition types. Any post-build modification
# of the rootfs changes the roothash → the measured cmdline (RTMR1) no longer
# matches the approved platform_commitment, and dm-verity itself refuses to
# mount a rootfs whose content does not match the roothash.
#
# The partition is NOT Minimize=best here (systemd-repart rejects it on a
# writable Verity=data partition); its size is a deterministic function of the
# fixed content + the mkosi Seed. Only the Verity=hash partition minimizes.
[Partition]
Type=root
Label=root
Format=ext4
Verity=data
VerityMatchKey=root
CopyFiles=/
# Fixed size (not Minimize=best, which systemd-repart forbids on a writable
# ext4 partition): large enough for the ~460 MiB rootfs plus headroom. A fixed
# size keeps the image deterministic (empty blocks are zeroed identically) and
# gives a stable verity roothash.
SizeMinBytes=768M
SizeMaxBytes=768M
