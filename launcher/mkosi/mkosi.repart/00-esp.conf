# ESP partition — holds the UKI (kernel + initrd + measured cmdline).
#
# Part of the dm-verity boot: the UKI's embedded command line carries the
# verity roothash (injected by mkosi from the root-verity partition below),
# and the UKI is what the TDX firmware measures into RTMR1. So the roothash
# — hence the exact rootfs content — is bound into platform_commitment.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
