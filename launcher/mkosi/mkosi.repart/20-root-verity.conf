# Root verity-hash partition — the dm-verity Merkle tree over the root
# partition. VerityMatchKey=root pairs it with 10-root.conf; systemd-repart
# derives the roothash from this pair. Keyless: no roothash signature partition
# is created, so the image needs no signing key and every operator rebuilds a
# byte-identical image with the same roothash and the same platform_commitment.
#
# No Minimize= here: systemd-repart requires the data and hash partitions to
# agree on Minimize=, and the ext4 data partition (writable at build time)
# cannot set Minimize=best. Sizes stay deterministic via fixed content + Seed;
# the rootfs is made read-only by the dm-verity layer, not by the fs type.
[Partition]
Type=root-verity
Label=root-verity
Verity=hash
VerityMatchKey=root
