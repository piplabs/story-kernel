# launcher/hardening/users.conf — system users created by mkosi.postinst.
#
# Format: username:uid:gid:home:shell  (colon-separated, one per line,
# comments start with #).  Used by hardening/install.sh.

# story-kernel: the DKG kernel runtime user.  No shell, no home write
# access.  Its only writable path is /var/lib/story-kernel (mounted from
# the data partition).
story-kernel:1000:1000:/var/lib/story-kernel:/usr/sbin/nologin
