# launcher/hardening/modprobe-blacklist.conf — block dangerous modules.
#
# Copied to /etc/modprobe.d/99-story-kernel-blacklist.conf by
# mkosi.postinst.  Each entry uses `install ... /bin/false` so even
# kmod's depmod path cannot load the module.

# === Debug / introspection paths ===
install kprobes               /bin/false
install kprobes_blacklist     /bin/false
install uprobes               /bin/false
install kgdb                  /bin/false

# === Memory access ===
# /dev/mem is gated by kernel config but the misc module landscape
# changes — belt-and-braces.
install mem                   /bin/false
install kmem                  /bin/false

# === Legacy / rare filesystems often used in CVE chains ===
install cramfs                /bin/false
install freevxfs              /bin/false
install jffs2                 /bin/false
install hfs                   /bin/false
install hfsplus               /bin/false
install squashfs              /bin/false
install udf                   /bin/false

# === Legacy / rare network protocols ===
install dccp                  /bin/false
install sctp                  /bin/false
install rds                   /bin/false
install tipc                  /bin/false

# === USB / mass storage in a server context ===
install usb-storage           /bin/false
install firewire-core         /bin/false
install thunderbolt           /bin/false
