# TDX configfs-tsm quote provider. These are built into the pinned kernel
# (CONFIG_TDX_GUEST_DRIVER=y, CONFIG_TSM_REPORTS=y), so the entries are
# defensive no-ops on this image; they only load if a future kernel config
# ships them as modules. The GCP platform vTPM driver (tcg_tis) is likewise
# built-in, so no vTPM proxy module is loaded here.
tdx-guest
tsm
