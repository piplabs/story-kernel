# story-kernel tmpfiles — runtime directories created at boot.
#
# /var/lib/story-kernel holds the DKG kernel's persistent data.  It is
# the ONLY rw mount on the rootfs (everything else is dm-verity ro).

d /var/lib/story-kernel 0700 story-kernel story-kernel - -
d /run/story-kernel     0700 story-kernel story-kernel - -
