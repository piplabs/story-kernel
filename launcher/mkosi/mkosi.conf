# mkosi.conf — top-level configuration for the reproducible story-kernel TD image.
#
# Targets mkosi >= 22 (systemd organization).  The same source tree + this
# config must produce a byte-identical rootfs across builders.  Determinism
# requirements:
#
#   - SOURCE_DATE_EPOCH is honored by mkosi when the environment exports it
#     (the build/build.sh wrapper sets it from the story-kernel commit date).
#   - All package versions are pinned via the Debian point release listed
#     under [Distribution]; no "latest" floats.
#   - mkosi.skeleton/ contents are copied verbatim; no templating.
#   - The post-install hook (mkosi.postinst) applies the hardening tree
#     under ../hardening/ and the initrd assets under ../initrd/.
#
# Determinism is verified by build/build.sh which rebuilds twice and diffs
# the SHA-256 of the rootfs artifact.

[Distribution]
Distribution=debian
Release=trixie
Mirror=https://deb.debian.org/debian
Repositories=main

[Output]
Format=disk
ImageId=story-kernel-td
ImageVersion=0.1.0-dev
OutputDirectory=../out
ManifestFormat=json
SplitArtifacts=kernel,initrd,partitions
# Fixed seed: systemd-repart derives every GPT/partition/filesystem UUID from
# it, so two builds of identical content produce byte-identical images. The
# ext4 htree hash_seed is NOT covered by this (repart does not pass it through);
# the builder image's deterministic mke2fs wrapper pins that separately.
Seed=b0c4e2a6-1111-4222-8333-444455556666

[Content]
Bootable=yes
Bootloader=uki

# IMPORTANT: every flag in KernelCommandLine ends up measured into RTMR1 by
# the TDX virtual firmware.  Adding/removing/changing a flag changes
# platform_commitment and invalidates the on-chain approval.  Keep this
# string under strict change control — diff against boot/kernel-cmdline.
KernelCommandLine=
        quiet
        selinux=0
        audit=0
        console=null
        loglevel=3
        systemd.show_status=false
        rd.systemd.show_status=false
        rd.udev.log_priority=3
        random.trust_cpu=on
        oops=panic
        panic=10
        slab_nomerge
        page_alloc.shuffle=1
        init_on_alloc=1
        init_on_free=1
        randomize_kstack_offset=on
        vsyscall=none
        debugfs=off
        lockdown=confidentiality

Packages=
        bash
        coreutils
        ca-certificates
        systemd
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        linux-image-amd64
        dracut
        libcap2-bin
        kmod
        iproute2
        swtpm
        swtpm-tools
        tpm2-tools
        tpm2-abrmd
        cryptsetup-bin
        xxd

RemoveFiles=
        # Strip any package state that varies build-to-build.  Without this
        # apt's per-build timestamps end up in /var/lib/dpkg and break
        # reproducibility.
        /var/cache/*
        /var/log/*
        /var/lib/apt/lists/*
        /var/lib/dpkg/status-old
        /usr/share/doc/*
        /usr/share/man/*
        /usr/share/info/*
        /usr/share/locale/*

# mkosi.skeleton/ holds files copied verbatim into the image.  See
# mkosi.skeleton/README.md for what lives there.
# mkosi.extra/ holds built artifacts (story-kernel ELF, etc.) that the
# top-level build/build.sh stages in just before mkosi runs.

[Validation]
Checksum=yes
Sign=no
