# launcher/initrd/modules-load.conf — kernel modules loaded by
# systemd-modules-load.service at the start of every boot.  Installed
# to /etc/modules-load.d/story-kernel.conf by mkosi.postinst.
#
# Every module here MUST also be in initrd/dracut-include.conf so that
# the early initramfs has it available — otherwise rootfs dm-verity or
# the vTPM proxy will not work and we panic before systemd starts.

# dm-verity: block-level integrity for the rootfs.  Loaded from
# initrd to mount the rootfs, listed here too for completeness so
# `lsmod` after boot shows it (a missing module would be diagnostic).
dm-verity

# configfs: required for the TDX MR_EXTEND interface at
# /sys/kernel/config/tsm/report (configfs-tsm).  The interface is
# what extend-rtmr3.sh writes to.
configfs
