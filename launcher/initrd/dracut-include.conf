# launcher/initrd/dracut-include.conf — dracut configuration to embed
# the modules and tools that the initramfs needs before systemd starts.
#
# Copied to /etc/dracut.conf.d/99-story-kernel.conf inside the rootfs by
# mkosi.postinst.  The next dracut invocation (which mkosi triggers when
# building the unified kernel image) picks this up.
#
# Reproducibility: dracut output is sensitive to host state.  We pin
# hostonly=no and include all needed modules explicitly so any builder
# produces the same initrd binary.

# Build a generic initrd, not one tied to the host where build runs.
hostonly="no"
hostonly_cmdline="no"

# Use compress=zstd with a fixed level for deterministic output.  xz is
# also deterministic but ~3x slower without meaningful size gain here.
compress="zstd -19 --threads=1"

# Drivers we need:
#   - dm_mod, dm_verity: rootfs verity
#   - tpm, tpm_vtpm_proxy: in-TD swtpm
#   - virtio_*, ext4, kernel-network-modules: standard cloud TD boot
add_drivers+=" dm_mod dm_verity tpm tpm_vtpm_proxy "

# dracut modules to include:
#   - dm-verity: verity setup at boot
#   - systemd-veritysetup: systemd-veritysetup-generator
add_dracutmodules+=" dm dm-verity systemd-veritysetup "

# Tools to embed:
#   - veritysetup binary (already pulled by dm-verity module on most
#     distros; explicit for safety)
#   - sha256sum, xxd — needed by our measure-binary.sh helper if
#     anything in initrd ever needs to extend a PCR before switch_root.
install_items+=" /sbin/veritysetup /usr/bin/sha256sum /usr/bin/xxd "

# Suppress the host-specific resume= hook so the initrd does not embed
# the build host's swap UUID.
omit_dracutmodules+=" resume "
