# launcher/hardening/sysctl.conf — runtime sysctl tightening for the TD.
#
# Copied to /etc/sysctl.d/99-story-kernel.conf by mkosi.postinst.
# Every entry has a justification — do not drop entries without
# documenting why in launcher/docs/threat-model.md.

# === Process inspection ===
# ptrace_scope=3 means NO process can ptrace ANY other process, regardless
# of credentials.  This blocks GDB attach, strace, and PTRACE_PEEK* against
# story-kernel.  The kernel does not need ptrace itself.
kernel.yama.ptrace_scope = 3

# === Kernel runtime control ===
# Disable kexec_load: an attacker with CAP_SYS_BOOT could otherwise load
# a fresh kernel image into memory and chain-boot it, bypassing
# dm-verity entirely.
kernel.kexec_load_disabled = 1

# Disable BPF JIT and unprivileged BPF.  BPF programs are a common vector
# for inspecting kernel memory; story-kernel does not need BPF.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Kernel pointer obfuscation in /proc, dmesg, and similar interfaces.
kernel.kptr_restrict = 2

# Restrict /dev/mem to root only (we further block it via udev).
kernel.dmesg_restrict = 1

# Disable user namespaces — used by many container/sandbox escapes and
# not required by story-kernel.
user.max_user_namespaces = 0

# Disable core dumps for setuid binaries (we ship none, defense in depth).
fs.suid_dumpable = 0

# Disable magic SysRq fully.  Even safe SysRq combinations let an operator
# kill processes or remount filesystems mid-run.
kernel.sysrq = 0

# === Memory protection ===
# Forbid hardlinks to files the user doesn't own — blocks a /tmp race
# where a non-root user races to hardlink a sensitive file.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Randomize VA space fully (default 2 is full ASLR; explicit for clarity).
kernel.randomize_va_space = 2

# === Network ===
# We expect outbound TLS to peers and gRPC to the consensus client only.
# These tighten the IPv4/IPv6 stack against ICMP/source-route shenanigans.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# === Coredump ===
# No core dumps anywhere — sealed material in memory must never hit disk.
kernel.core_pattern = |/bin/false
